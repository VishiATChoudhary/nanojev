[project]
name = "nanojev"
version = "0.1.0"
description = "Typed, calibrated decisions from a local model. No token generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "classification", "calibration", "zero-shot", "structured-output"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "numpy>=1.24",
]

[project.optional-dependencies]
bench = ["datasets>=2.18", "sentencepiece>=0.2", "scipy>=1.11"]
dev = ["pytest>=8.0"]

[project.scripts]
nanojev = "nanojev.__main__:main"

[project.urls]
Homepage = "https://github.com/VishiATChoudhary/nanojev"
Issues = "https://github.com/VishiATChoudhary/nanojev/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanojev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
