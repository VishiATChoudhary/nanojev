name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        # CPU-only torch keeps the CI image small; the tests never touch a model.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --torch-backend=cpu -e ".[dev]"
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Import check
        run: uv run --no-sync python -c "import nanojev; print(nanojev.__all__)"
